name: Build blog pages

on:
  push:
    branches: [main]
    paths:
      - "blog-posts.json"
      - "translations.json"
      - "scripts/build-blog.mjs"
  pull_request:
    branches: [main]
    paths:
      - "blog-posts.json"
      - "translations.json"
      - "scripts/build-blog.mjs"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate static blog pages
        run: npm run build:blog

      - name: Commit regenerated pages
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blog en de sitemap.xml
          git diff --cached --quiet || git commit -m "chore: regenerate static blog pages"
          git push
